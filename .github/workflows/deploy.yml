name: Build and Push to ACR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: gintlyregistry.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build --build-arg GIT_SHA="${{ github.sha }}" \
            -t gintlyregistry.azurecr.io/gintly-app:${{ github.sha }} \
            -t gintlyregistry.azurecr.io/gintly-app:latest .
          docker push gintlyregistry.azurecr.io/gintly-app:${{ github.sha }}
          docker push gintlyregistry.azurecr.io/gintly-app:latest
